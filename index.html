<style>

}
:root[data-theme="dark"]{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:13px/1.42 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;background:#eaf0f6;color:#25445f;transition:all .15s}
button:hover{filter:brightness(.95)}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;transition:all .2s ease}
.side{background:linear-gradient(180deg,#10263d,#123b5c);color:white;padding:16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.brand small{display:block;font-size:7.5px;letter-spacing:1px;color:#9dc9e3;font-weight:800;text-transform:uppercase}
.brand strong{font-size:13px;color:#fff;line-height:1.2;display:block}
.nav-label{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#82a3bd;padding:0 8px;margin-bottom:4px}
.nav{display:grid;gap:3px}

.nav button{background:transparent;color:#c3d4e2;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.nav button.active{background:#ffffff19;color:#fff;box-shadow:inset 3px 0 var(--cyan)}
.nav button span.icon{font-size:15px;min-width:20px;text-align:center}
.nav button span.txt{transition:opacity .15s}

.side-shift-card{
  background: rgba(255,255,255,0.06);border: 1px solid rgba(38,189,200,0.35);
  border-radius: 10px;padding: 10px;
}
.side-shift-title{font-size: 9px;font-weight: 800;color: var(--cyan);letter-spacing: 0.5px;margin-bottom: 6px;display:flex;align-items:center;gap:5px}
.side-shift-item{margin-bottom: 5px}
.side-shift-item:last-child{margin-bottom:0}
.side-shift-item small{display: block;color: #82a3bd;font-size: 8px;font-weight: 700;margin-bottom: 1px}
.side-shift-item strong{font-size: 10.5px;color: #ffffff;word-break: break-word}
.side-shift-item span.phone{color: var(--cyan);font-weight: 800}

/* KHỐI NÚT CHỨC NĂNG DỌC TRÁI DƯỚI BỘ PHẬN TRỰC */

  border-radius: 10px;
  padding: 10px;
  display: grid;
  gap: 6px;
}
.side-quick-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.side-btn{
  width: 100%;

  font-size: 10.5px;

  align-items: center;

  gap: 5px;

  border: 1px solid transparent;
}
.side-btn.countdown-btn{

}
.side-btn.countdown-btn:hover{background:rgba(38,189,200,0.25)}

.side-btn.bucket-btn{background: #1f5e82; color: #fff}

.main{min-width:0}

/* TOPBAR ĐƯỢC TINH CHỈNH TỐI ƯU */
.topbar{
  padding: 8px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-header-left{
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.topbar-title-row{
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.crumb{font-size:9.5px;color:var(--muted);font-weight:700}
.topbar h1{font-size:16px;margin:0;font-weight:850;color:var(--navy2);line-height:1.2}
:root[data-theme="dark"] .topbar h1{color:var(--cyan)}

/* DẢI LỌC NGÀY NẰM SÁT DƯỚI TIÊU ĐỀ */
.topbar-date-filter{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
.date-input-inline{
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 6px;
  background: var(--bg);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
}
.date-input-inline:focus{border-color:var(--cyan)}

/* TOPBAR ACTIONS & BIỂU TƯỢNG BỨC THƯ CÓ SỐ ĐỎ BÁO TIN NHẮN */
.topbar-right{
  display: flex;
  align-items: center;
  gap: 10px;
}
.mail-btn-container{
  position: relative;
  display: inline-flex;
  align-items: center;
}
.mail-action-btn{
  background: linear-gradient(135deg, rgba(38,189,200,0.12), rgba(16,43,70,0.08));
  border: 1px solid rgba(38,189,200,0.35);
  color: var(--navy2);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  padding: 0;
  cursor: pointer;
  transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
:root[data-theme="dark"] .mail-action-btn{
  background: rgba(38,189,200,0.15);
  border-color: rgba(38,189,200,0.4);
  color: #8be4ec;
}
.mail-action-btn:hover{
  background: var(--cyan);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(38,189,200,0.35);
}
.mail-badge-counter{
  position: absolute;
  top: -5px;
  right: -5px;
  background: #e74c3c;
  color: #ffffff;
  font-size: 10px;
  font-weight: 900;
  min-width: 19px;
  height: 19px;
  line-height: 19px;
  padding: 0 4px;
  border-radius: 10px;
  text-align: center;
  border: 2px solid var(--card);
  box-shadow: 0 2px 6px rgba(231,76,60,0.5);
  pointer-events: none;
  animation: mailPulse 2s infinite ease-in-out;
}
.mail-badge-counter.hidden{
  display: none !important;
}
@keyframes mailPulse{
  0%, 100%{ transform: scale(1); }
  50%{ transform: scale(1.18); box-shadow: 0 0 10px rgba(231,76,60,0.85); }
}

const $ = id => document.getElementById(id);
const esc = v => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showNotificationToast(msg, isError = false) {
  let container = $('customToastContainer');
  if (!container) return;
  let t = document.createElement('div');
  t.className = 'toast-notice' + (isError ? ' err' : '');
  t.innerHTML = `<span>${isError ? '⚠️' : '✓'}</span><span>${esc(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .35s ease';
    setTimeout(() => t.remove(), 350);
  }, 3500);
}

function getLocalFeedbackReports() {
  try {
    return JSON.parse(localStorage.getItem('hp_feedback_reports') || '[]');
  } catch(e) {
    return [];
  }
}

function saveLocalFeedbackReports(list) {
  localStorage.setItem('hp_feedback_reports', JSON.stringify(list));
}

function updateMailBadge() {
  let badge = $('mailBadge');
  if (!badge) return;
  let unreadCount = feedbackReportsList.filter(item => item.status !== 'resolved').length;
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
    badge.textContent = '0';
  }
}

async function fetchFeedbacksList(silent = false) {
  let loadedFromSupabase = false;
  try {
    let { data, error } = await supabaseClient
      .from('feedback_reports')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error && Array.isArray(data)) {
      feedbackReportsList = data;
      loadedFromSupabase = true;
      saveLocalFeedbackReports(data);
    }
  } catch(err) {
    console.warn('Lỗi đọc feedback từ Supabase:', err);
  }

  if (!loadedFromSupabase) {
    feedbackReportsList = getLocalFeedbackReports();
  }

  updateMailBadge();
  renderInboxContent();
  if (!silent) {
    showNotificationToast(currentLang === 'vi' ? 'Đã đồng bộ hòm thư phản ánh' : 'Inbox synchronized');
  }
}

async function submitFeedbackReport(e) {
  e.preventDefault();
  let name = ($('repName').value || '').trim();
  let contact = ($('repContact').value || '').trim();
  let company = ($('repCompany').value || '').trim();
  let reportType = $('repType').value;
  let vessel = ($('repVessel').value || '').trim();
  let content = ($('repContent').value || '').trim();

  if (!name || !contact || !content) {
    showNotificationToast(currentLang === 'vi' ? 'Vui lòng điền đủ các trường (*)' : 'Please fill all required fields (*)', true);
    return;
  }

  let submitBtn = $('sendFeedbackBtn');
  submitBtn.disabled = true;
  submitBtn.style.opacity = '0.7';

  let newReportObj = {
    id: 'rep_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    name: name,
    contact: contact,
    company: company,
    report_type: reportType,
    vessel: vessel,
    content: content,
    status: 'unread',
    created_at: new Date().toISOString()
  };

  // 1. Lưu lớp 1 vào LocalStorage ngay lập tức
  let localList = getLocalFeedbackReports();
  localList.unshift(newReportObj);
  saveLocalFeedbackReports(localList);

  feedbackReportsList.unshift(newReportObj);
  updateMailBadge();
  renderInboxContent();

  // 2. Lưu lớp 2 vào Supabase Table
  try {
    let { data, error } = await supabaseClient.from('feedback_reports').insert([{
      name: name,
      contact: contact,
      company: company,
      report_type: reportType,
      vessel: vessel,
      content: content,
      status: 'unread'
    }]).select();

    if (!error && data && data.length > 0) {
      newReportObj.id = data[0].id;
      saveLocalFeedbackReports(feedbackReportsList);
    }
  } catch(err) {
    console.warn('Gửi lên Supabase gặp lỗi, đã lưu bền vững LocalStorage:', err);
  }

  submitBtn.disabled = false;
  submitBtn.style.opacity = '1';
  $('reportForm').reset();

  showNotificationToast(currentLang === 'vi' 
    ? 'Đã gửi phản ánh thành công tới Trung tâm Khai thác!' 
    : 'Feedback sent successfully!');

  setTimeout(() => {
    nav('overview');
  }, 1200);
}

function renderInboxContent() {
  let container = $('inboxListContainer');
  if (!container) return;

  let totalActive = feedbackReportsList.length;
  let summaryText = currentLang === 'vi' 
    ? `Có ${totalActive} thư phản ánh (${feedbackReportsList.filter(x => x.status !== 'resolved').length} chưa xử lý)` 
    : `Total ${totalActive} feedbacks (${feedbackReportsList.filter(x => x.status !== 'resolved').length} unread)`;
  $('inboxSummaryText').textContent = summaryText;

  if (feedbackReportsList.length === 0) {
    container.innerHTML = `<div class="empty">${currentLang === 'vi' ? '📭 Hòm thư trống. Chưa có phản ánh nào.' : '📭 Inbox is empty. No feedbacks yet.'}</div>`;
    return;
  }

  let delBtnText = currentLang === 'vi' ? '🗑️ Xóa thư (Đã xử lý)' : '🗑️ Delete (Resolved)';
  let contactLabel = currentLang === 'vi' ? 'Liên hệ: ' : 'Contact: ';
  let unitLabel = currentLang === 'vi' ? 'Đơn vị: ' : 'Unit: ';
  let vesselLabel = currentLang === 'vi' ? 'Tàu/Bến: ' : 'Vessel: ';

  let html = feedbackReportsList.map(item => {
    let itemId = item.id;
    let isUrgent = (item.report_type || '').includes('khẩn') || (item.report_type || '').includes('ETB');
    let senderName = item.name || item.sender_name || 'Khách hàng';
    let vesselName = item.vessel || item.vessel_info || '';
    return `
      <div class="mail-item-box" id="mail_card_${itemId}">
        <div class="mail-item-header">
          <div class="mail-sender-title">
            <span>👤 ${esc(senderName)}</span>
            <span class="mail-tag ${isUrgent ? 'urgent' : ''}">${esc(item.report_type || 'Góp ý')}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);font-weight:700">🕒 ${dt(item.created_at)}</div>
        </div>
        <div class="mail-meta-line">
          <span><b>${contactLabel}</b>${esc(item.contact || '—')}</span>
          <span><b>${unitLabel}</b>${esc(item.company || '—')}</span>
          ${vesselName ? `<span><b>${vesselLabel}</b><b style="color:var(--cyan)">${esc(vesselName)}</b></span>` : ''}
        </div>
        <div class="mail-content-text">${esc(item.content)}</div>
        <div class="mail-actions-row">
          <button class="btn-del-mail" onclick="deleteSingleFeedback('${itemId}')">${delBtnText}</button>
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = html;
}

async function deleteSingleFeedback(id) {
  let confirmMsg = currentLang === 'vi' 
    ? 'Bạn có chắc chắn muốn xóa thư này sau khi đã giải quyết?' 
    : 'Are you sure you want to delete this resolved feedback?';
  
  if (!confirm(confirmMsg)) return;

  try {
    if (typeof id === 'number' || (typeof id === 'string' && !id.startsWith('rep_'))) {
      await supabaseClient.from('feedback_reports').delete().eq('id', id);
    }
  } catch(err) {
    console.warn('Lỗi khi xóa trên Supabase:', err);
  }

  feedbackReportsList = feedbackReportsList.filter(item => String(item.id) !== String(id));
  saveLocalFeedbackReports(feedbackReportsList);

  updateMailBadge();
  renderInboxContent();
  showNotificationToast(currentLang === 'vi' ? 'Đã xóa phản ánh thành công!' : 'Feedback deleted successfully!');
}

async function clearAllProcessedFeedbacks() {
  if (feedbackReportsList.length === 0) return;
  let confirmMsg = currentLang === 'vi' 
    ? 'Bạn có chắc chắn muốn dọn sạch tất cả thư trong hòm thư?' 
    : 'Are you sure you want to delete all messages in inbox?';
  
  if (!confirm(confirmMsg)) return;

  try {
    await supabaseClient.from('feedback_reports').delete().neq('id', 0);
  } catch(err) {}

  feedbackReportsList = [];
  saveLocalFeedbackReports([]);

  updateMailBadge();
  renderInboxContent();
  showNotificationToast(currentLang === 'vi' ? 'Đã làm sạch toàn bộ hòm thư!' : 'Cleared all inbox messages!');
}

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('hp_lang', lang);
  const d = dict[lang];

  $('langFlag').textContent = lang === 'vi' ? '🇻🇳' : '🇬🇧';
  $('langText').textContent = lang === 'vi' ? 'VI' : 'EN';

  for (let key in d) {
    let elem = $(key) || $('t_' + key) || $('lbl_' + key) || $('th_' + key);
    if (elem) {
      if (elem.tagName === 'INPUT' && elem.type === 'button') elem.value = d[key];
      else elem.textContent = d[key];
    }
  }

  $('search').placeholder = lang === 'vi' ? 'Tìm tên tàu, hãng...' : 'Search vessel, operator...';
  $('planningSearch').placeholder = lang === 'vi' ? '🔍 Tìm kiếm tàu, hãng, bến...' : '🔍 Search vessel, operator, berth...';

  renderAll();
  updateMailBadge();
}

function getTodayString() {
  let d = new Date();
  let year = d.getFullYear();
  let month = String(d.getMonth() + 1).padStart(2, '0');
  let day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function dt(v){
  if(!v) return '—';
  let d = new Date(v);
  let locale = currentLang === 'vi' ? 'vi-VN' : 'en-GB';
  return isNaN(d) ? esc(v) : d.toLocaleString(locale, {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}

function formatDateTimeLocal(v) {
  if (!v) return '';
  let d = new Date(v);
  if (isNaN(d)) return '';
  let pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDuration(ms) {
  let d = dict[currentLang];
  if (isNaN(ms) || ms <= 0) return `0 ${d.minUnit}`;
  let totalMin = Math.floor(ms / 60000);
  let hrs = Math.floor(totalMin / 60);
  let mins = totalMin % 60;
  if (hrs > 0) {
    return `${hrs} ${d.hourUnit} ${mins} ${d.minUnit}`;
  }
  return `${mins} ${d.minUnit}`;
}

function parseEtbEtd(etbStr, etdStr) {
  let t1 = etbStr ? new Date(etbStr).getTime() : 0;
  let t2 = etdStr ? new Date(etdStr).getTime() : 0;

    t2 = 0;
  }
  return { etb: etbStr || '', etd: etdStr || '', t1, t2 };
}

async function fetchRealWeatherHaiPhong() {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=20.8651&longitude=106.6838&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=Asia%2FBangkok';
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.current) {
      const c = data.current;
      const curTemp = Math.round(c.temperature_2m);
      if ($('wTemp')) $('wTemp').textContent = curTemp + '°C';
      if ($('wWind')) $('wWind').textContent = `🧭 SE · ${c.wind_speed_10m} m/s`;
      if ($('wHum')) $('wHum').textContent = `💧 ${c.relative_humidity_2m}%`;

      const nowH = new Date().getHours();
      const isNight = nowH < 6 || nowH >= 18;
      if ($('wIcon')) $('wIcon').textContent = isNight ? '🌙' : '☀️';
      if ($('wCond')) $('wCond').textContent = isNight ? (currentLang === 'vi' ? 'Quang đãng · Đêm an toàn' : 'Clear Sky · Safe Night') : (currentLang === 'vi' ? 'Nắng nhẹ · Quang đãng' : 'Sunny · Clear');
      if ($('whNow')) $('whNow').innerHTML = `${isNight ? '🌙' : '☀️'} ${curTemp}°`;

      if (data.hourly && data.hourly.temperature_2m) {
        for (let i = 1; i <= 4; i++) {
          let targetH = (nowH + i * 3) % 24;
          let idx = nowH + i * 3;
          let tVal = Math.round(data.hourly.temperature_2m[idx] || curTemp);
          if ($(`wh${i}Time`)) $(`wh${i}Time`).textContent = String(targetH).padStart(2, '0') + ':00';
          if ($(`wh${i}Val`)) $(`wh${i}Val`).innerHTML = `${targetH < 6 || targetH >= 18 ? '🌙' : '🌤️'} ${tVal}°`;
        }
      }
    }
  } catch(e) {
    let nowH = new Date().getHours();
    let tempCalculated = Math.round(26 + Math.sin(nowH / 3) * 3);
    if ($('wTemp')) $('wTemp').textContent = tempCalculated + '°C';
    if ($('whNow')) $('whNow').innerHTML = `☀️ ${tempCalculated}°`;
  }
}

function updateRealtimeWidgets() {
  let now = new Date();
  let timeStr = now.toTimeString().split(' ')[0];
  if ($('liveClock')) $('liveClock').textContent = timeStr;
  
  let hours = now.getHours();
  let minutes = now.getMinutes();
  let totalMinNow = hours * 60 + minutes;

  let tidePhase = Math.sin((totalMinNow - 252) / (859 - 252) * Math.PI);
  let currentTideLevel = (1.60 + (tidePhase > 0 ? tidePhase * 0.70 : Math.abs(tidePhase) * 0.40)).toFixed(2);

  if ($('tideProgStatus')) {
    if (tidePhase >= 0) {
      $('tideProgStatus').textContent = currentLang === 'vi' ? `Đang dâng (~${currentTideLevel}m)` : `Flooding (~${currentTideLevel}m)`;
      $('tideProgStatus').style.color = '#8be4ec';
    } else {
      $('tideProgStatus').textContent = currentLang === 'vi' ? `Đang rút (~${currentTideLevel}m)` : `Ebbing (~${currentTideLevel}m)`;
      $('tideProgStatus').style.color = '#ffb347';
    }
  }
  let fillPercent = Math.max(10, Math.min(95, Math.round(((currentTideLevel - 1.60) / (2.30 - 1.60)) * 100)));
  if ($('tideProgressBar')) $('tideProgressBar').style.width = fillPercent + '%';
  
  renderMovement(getFilteredCalls());
}

function startMidnightCountdown() {
  setInterval(() => {
    let now = new Date();
    let midnight = new Date();
    midnight.setHours(24, 0, 0, 0); 
    let diffMs = midnight.getTime() - now.getTime();

    if (diffMs <= 1000) {
      saveCurrentDataToSupabase(true);
      loadData();
      return;
    }

    let hrs = Math.floor(diffMs / (1000 * 60 * 60));
    let mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    let secs = Math.floor((diffMs % (1000 * 60)) / 1000);

    let dispStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    let cdElem = $('countdown');
    if (cdElem) cdElem.textContent = dispStr;

    updateRealtimeWidgets();
  }, 1000);
}

function filterAndDeduplicateCalls(rawList) {
  let processedList = rawList.map(c => {
    let vName = (c.vessel || '').trim().toUpperCase();
    let override = vesselOverridesMap.get(vName);
    
    if (override) {
      let mergedEtb = override.etb || c.etb || '';
      let mergedEtd = override.etd || c.etd || '';
      let times = parseEtbEtd(mergedEtb, mergedEtd);

      return {
        ...c,
        operator: override.operator || c.operator || '',
        terminal: override.terminal || c.terminal || '',
        berth: override.berth || c.berth || '',
        loa: override.loa !== null && override.loa !== undefined && override.loa !== '' ? Number(override.loa) : c.loa,
        dwt: override.dwt || c.dwt || '',
        etb: times.etb,
        etd: times.etd
      };
    }

    let times = parseEtbEtd(c.etb, c.etd);
    return {
      ...c,
      etb: times.etb,
      etd: times.etd
    };
  });

  processedList.forEach(c => {
    let vName = (c.vessel || '').trim().toUpperCase();
    if (!vName) return;

    if (!masterGlobalVesselMap.has(vName)) {
      masterGlobalVesselMap.set(vName, c);
    } else {
      let existing = masterGlobalVesselMap.get(vName);
      if (!existing.etb && c.etb) {
        existing.etb = c.etb;
        let reValid = parseEtbEtd(existing.etb, existing.etd);
        existing.etd = reValid.etd;
      }
    }
  });

  let filledList = processedList.map(c => {
    let vName = (c.vessel || '').trim().toUpperCase();
    let master = masterGlobalVesselMap.get(vName);
    if (master) {
      let finalEtb = c.etb || master.etb || '';
      let finalEtd = c.etd || master.etd || '';
      let times = parseEtbEtd(finalEtb, finalEtd);

      return {
        ...c,
        etb: times.etb,
        etd: times.etd,
        terminal: c.terminal || master.terminal || '',
        berth: c.berth || master.berth || '',
        operator: c.operator || master.operator || '',
        loa: c.loa || master.loa || 0,
        dwt: c.dwt || master.dwt || ''
      };
    }
    return c;
  });

  let finalMap = new Map();
  filledList.forEach(c => {
    let vName = (c.vessel || '').trim().toUpperCase();
    if (!vName) return;
    if (!finalMap.has(vName)) {
      finalMap.set(vName, c);
    } else {
      let existing = finalMap.get(vName);
      let exScore = (existing.etb ? 2 : 0) + (existing.etd ? 2 : 0);
      let curScore = (c.etb ? 2 : 0) + (c.etd ? 2 : 0);
      if (curScore >= exScore) finalMap.set(vName, c);
    }
  });

  return Array.from(finalMap.values());
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const lines = evt.target.result.split('\n');
      let loaded = [];
      for (let i = 2; i < lines.length; i++) {
        let cols = lines[i].trim().split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (cols.length >= 9) {
          loaded.push({
            vessel: cols[1].replace(/["']/g, ''),
            operator: cols[2].replace(/["']/g, ''),
            terminal: cols[3].replace(/["']/g, ''),
            berth: cols[4].replace(/["']/g, ''),
            loa: Number(cols[5]) || 0,
            dwt: cols[6] || '',
            etb: cols[7].replace(/["']/g, ''),
            etd: cols[8].replace(/["']/g, '')
          });
        }
      }
      if (loaded.length > 0) {
        allCalls = filterAndDeduplicateCalls(loaded);
        renderAll();
        alert(currentLang === 'vi' ? `Đã nạp ${allCalls.length} tàu từ file thành công!` : `Imported ${allCalls.length} vessels successfully!`);
      }
    } catch(err) { alert('Error: ' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

  return t.includes('TÂN VŨ') || t.includes('TAN VU') || t.includes('HOÀNG DIỆU') || t.includes('CHÙA VẼ') || t.includes('HTIT') || t.includes('ĐÌNH VŨ');
}

function getFilteredCalls() {
  let fDate = $('fromDate').value;
  let tDate = $('toDate').value;
  let filtered = allCalls.filter(c => {
    let shipDate = (c.etb || c.etd || '').split('T')[0];
    if (!shipDate) return true;
    if (fDate && shipDate < fDate) return false;
    if (tDate && shipDate > tDate) return false;
    return true;
  });
  return filterAndDeduplicateCalls(filtered);
}

function renderAll() {
  const now = Date.now();
  let list = getFilteredCalls();

  let working = list.filter(c => {
    let t1 = c.etb ? new Date(c.etb).getTime() : 0;
    let t2 = c.etd ? new Date(c.etd).getTime() : Infinity;
    return now >= t1 && (t2 === 0 || now <= t2);
  });
  $('kWorking').textContent = working.length;

  let totalLoa = list.filter(c => isHaiPhongPort(c.terminal)).reduce((s, c) => s + (c.loa || 0), 0);
  $('kLoa').textContent = totalLoa.toLocaleString(currentLang === 'vi' ? 'vi-VN' : 'en-US') + 'm';

  let in24 = now + 86400000;
  $('kArrivals').textContent = list.filter(c => c.etb && new Date(c.etb).getTime() >= now && new Date(c.etb).getTime() <= in24).length;
  $('kDepartures').textContent = list.filter(c => c.etd && new Date(c.etd).getTime() >= now && new Date(c.etd).getTime() <= in24).length;
  $('kLarge').textContent = list.filter(c => c.loa >= 300).length;

  renderTanVuLayout(list);
  renderMovement(list);
  renderTable(list);

  let p = localStorage.getItem('hp_last_page') || 'overview';
  if(p === 'planning') renderGantt();
  if(p === 'stats') renderStats();
}

function renderTanVuLayout(list) {
  let tanVuShips = list.filter(c => (c.terminal || '').toUpperCase().includes('TÂN VŨ') || (c.terminal || '').toUpperCase().includes('TAN VU'));
  $('tanvuCount').textContent = tanVuShips.length + ' ' + (currentLang === 'vi' ? 'lượt tàu' : 'calls');

  let berthMap = {};
  tanVuShips.forEach(c => {
    let b = c.berth || 'B1';
    if (!berthMap[b]) berthMap[b] = [];
    berthMap[b].push(c);
  });
  ['B1', 'B2', 'B3', 'B4', 'B5'].forEach(b => { if (!berthMap[b]) berthMap[b] = []; });

  let termTitle = currentLang === 'vi' ? 'CẢNG TÂN VŨ' : 'TAN VU TERMINAL';
  let emptyTxt = currentLang === 'vi' ? 'Trống' : 'Vacant';
  let html = `<div class="berth-group"><div class="berth-group-head"><span class="berth-group-title">${termTitle}</span></div>`;
  Object.keys(berthMap).sort().forEach(bName => {
    let ships = berthMap[bName].sort((a,b) => new Date(a.etb||0) - new Date(b.etb||0));
    html += `<div class="berth-row"><div class="berth-name">${bName}</div><div class="berth-ships">`;
    if (ships.length === 0) {
      html += `<span class="empty-berth">${emptyTxt}</span>`;
    } else {
      ships.forEach(s => {
        html += `<div class="ship-chip ${s.loa >= 300 ? 'large' : ''}" onclick="showTooltip(event, ${JSON.stringify(s).replace(/"/g, '&quot;')})" onmouseenter="showTooltip(event, ${JSON.stringify(s).replace(/"/g, '&quot;')})" onmouseleave="scheduleHideTooltip()"><span>${esc(s.vessel)}</span><span class="chip-time">${s.loa}m</span></div>`;
      });
    }
    html += `</div></div>`;
  });
  html += `</div>`;
  $('tanvuBerthsLayout').innerHTML = html;
}

function renderMovement(list) {
  let now = Date.now();
  let todayStr = getTodayString();
  let threeHoursMs = 3 * 3600 * 1000;
  let items = [];
  let d = dict[currentLang];

  list.forEach(c => {
    let t1 = c.etb ? new Date(c.etb).getTime() : 0;
    let t2 = c.etd ? new Date(c.etd).getTime() : 0;
    let etbDateStr = (c.etb || '').split('T')[0];
    let etdDateStr = (c.etd || '').split('T')[0];

    if (etbDateStr === todayStr && (movementMode === 'all' || movementMode === 'arriving')) {
      if (t1 > now) {
        items.push({ c, type: 'arriving', time: t1, sortVal: t1 });
      } else if (t1 <= now && (t2 === 0 || now <= t2)) {
        let timeDocked = now - t1;
        if (timeDocked <= threeHoursMs) {
          items.push({ c, type: 'working', time: t1, sortVal: now });
        }
      }
    }

    if (etdDateStr === todayStr && t2 > now && (movementMode === 'all' || movementMode === 'departing')) {
      items.push({ c, type: 'departing_soon', time: t2, sortVal: t2 });
    }

    if (t2 > 0 && t2 <= now && (movementMode === 'all' || movementMode === 'departed')) {
      items.push({ c, type: 'departed', time: t2, sortVal: t2 });
    }
  });

  items.sort((a,b) => Math.abs(a.sortVal - now) - Math.abs(b.sortVal - now));

  if (items.length === 0) {
    $('movement').innerHTML = `<div class="empty">${currentLang === 'vi' ? 'Không có dữ liệu điều động phù hợp.' : 'No movements found.'}</div>`;
    stopAutoScroll();
    return;
  }

  let html = items.map(item => {
    let badgeHtml = '';
    if (item.type === 'arriving') {
      badgeHtml = `<span class="tag-vivid urgent">${d.arrRemaining} ${formatDuration(item.time - now)}</span>`;
    } else if (item.type === 'working') {
      badgeHtml = `<span class="tag-vivid arriving">${d.dockedElapsed} ${formatDuration(now - item.time)}</span>`;
    } else if (item.type === 'departing_soon') {
      badgeHtml = `<span class="tag-vivid urgent">${d.depRemaining} ${formatDuration(item.time - now)}</span>`;
    } else if (item.type === 'departed') {
      badgeHtml = `<span class="tag-vivid departing">${d.depElapsed} ${formatDuration(now - item.time)} ${d.agoText}</span>`;
    }

    return `<div class="trow"><div class="t-time">${dt(item.time).split(' ')[1] || '—'}</div><div class="t-card"><div><strong>${esc(item.c.vessel)}</strong><div class="muted tiny">${esc(item.c.terminal)} · ${item.c.loa}m</div></div>${badgeHtml}</div></div>`;
  }).join('');

  if (items.length > 8) {
    $('movement').innerHTML = html + html;
    startAutoScroll();
  } else {
    $('movement').innerHTML = html;
    stopAutoScroll();
  }
}

function startAutoScroll() {
  stopAutoScroll();
  const container = $('movementContainer');
  if (!container) return;

  autoScrollTimer = setInterval(() => {
    if (isUserHovering) return;

    let halfHeight = container.scrollHeight / 2;
    if (container.scrollTop >= halfHeight) {
      container.scrollTop = 0;
    } else {
      container.scrollTop += 0.5;
    }
  }, 35);
}

function stopAutoScroll() {
  if (autoScrollTimer) {
    clearInterval(autoScrollTimer);
    autoScrollTimer = null;
  }
}

function pauseAutoScroll() {
  isUserHovering = true;
}

function resumeAutoScroll() {
  isUserHovering = false;
}

function filterMovement(m, btn) {
  movementMode = m;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMovement(getFilteredCalls());
}

function renderTable(list) {
  let q = ($('search')?.value || '').toLowerCase();
  let filtered = list.filter(c => !q || [c.vessel, c.operator, c.terminal, c.berth].join(' ').toLowerCase().includes(q));
  let emptyMsg = currentLang === 'vi' ? 'Không tìm thấy bản ghi.' : 'No records found.';
  $('rows').innerHTML = filtered.length ? filtered.map((c, i) => `
    <tr><td>${i+1}</td><td class="vessel">${esc(c.vessel)}</td><td><span class="badge">${esc(c.operator)}</span></td><td>${c.loa}</td><td>${c.dwt}</td><td>${esc(c.terminal)} · ${esc(c.berth)}</td><td>${dt(c.etb)}</td><td>${dt(c.etd)}</td></tr>
  `).join('') : `<tr><td colspan="8" class="empty">${emptyMsg}</td></tr>`;
}

function renderGantt() {
  let days = +$('days').value || 4;
  let start = new Date($('fromDate').value || getTodayString()); start.setHours(0,0,0,0);
  let end = new Date(start.getTime() + days * 86400000);
  let list = getFilteredCalls();
  let searchQuery = ($('planningSearch')?.value || '').toLowerCase();

  let headerHtml = `<div class="gantt-head"><div class="berth-label">${currentLang === 'vi' ? 'CẦU BẾN' : 'BERTHS'}</div><div class="gantt-timeline-header">`;
  for (let d = 0; d < days; d++) {
    let curDate = new Date(start.getTime() + d * 86400000);
    let dateStr = `${curDate.getDate()}/${curDate.getMonth() + 1}`;
    headerHtml += `
      <div class="gantt-time-slot">${dateStr} <span>00:00 - 12:00</span></div>
      <div class="gantt-time-slot">${dateStr} <span>12:00 - 24:00</span></div>
    `;
  }
  headerHtml += `</div></div>`;

  let terms = {};
  list.forEach(c => {
    if (planningAreaFilter !== 'ALL' && !(c.terminal || '').toUpperCase().includes(planningAreaFilter)) return;
    if (searchQuery && ![c.vessel, c.operator, c.terminal, c.berth].join(' ').toLowerCase().includes(searchQuery)) return;
    let key = (c.terminal || 'Other') + ' · ' + (c.berth || 'B1');
    if (!terms[key]) terms[key] = [];
    terms[key].push(c);
  });

  let out = headerHtml;
  let hasData = false;
  for (let [name, ships] of Object.entries(terms)) {
    hasData = true;
    out += `<div class="gantt-row"><div class="berth-label">${esc(name)}</div><div class="track">`;
    ships.forEach(c => {
      let a = c.etb ? new Date(c.etb).getTime() : start.getTime();
      let b = c.etd ? new Date(c.etd).getTime() : a + 3600000;
      let left = Math.max(0, Math.min(100, (a - start) / (end - start) * 100));
      let right = Math.max(left + 2, Math.min(100, (b - start) / (end - start) * 100));
      if (a < end.getTime() && b >= start.getTime()) {
        out += `<div class="shipbar ${c.loa >= 300 ? 'large' : ''}" style="left:${left}%;width:${right-left}%" onclick="showTooltip(event, ${JSON.stringify(c).replace(/"/g, '&quot;')})" onmouseenter="showTooltip(event, ${JSON.stringify(c).replace(/"/g, '&quot;')})" onmouseleave="scheduleHideTooltip()">${esc(c.vessel)}</div>`;
      }
    });
    out += `</div></div>`;
  }
  
  if (!hasData) {
    out += `<div class="empty">${currentLang === 'vi' ? 'Không có dữ liệu kế hoạch phù hợp.' : 'No planning data available.'}</div>`;
  }
  $('fullGantt').innerHTML = out;
  $('planningCount').textContent = `${Object.keys(terms).length} ${currentLang === 'vi' ? 'bến có tàu' : 'berths occupied'}`;
}

function filterPlanningArea(area, btn) {
  planningAreaFilter = area;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('primary'));
  btn.classList.add('primary');
  renderGantt();
}

let statsVesselCache = { terminals: {}, operators: {}, loaBins: {} };

function renderStats() {
  let list = getFilteredCalls();
  statsVesselCache = { terminals: {}, operators: {}, loaBins: {} };

  let emptyMsg = currentLang === 'vi' ? 'Không có dữ liệu' : 'No data';
  if (!list || list.length === 0) {
    $('statTerminals').innerHTML = `<div class="empty">${emptyMsg}</div>`;
    $('statOperators').innerHTML = `<div class="empty">${emptyMsg}</div>`;
    $('statLoaBins').innerHTML = `<div class="empty">${emptyMsg}</div>`;
    $('statHours').innerHTML = `<div class="empty" style="grid-column:1/-1">${emptyMsg}</div>`;
    return;
  }

  let termMap = {};
  list.forEach(c => {
    let t = c.terminal || (currentLang === 'vi' ? 'Khác' : 'Other');
    termMap[t] = (termMap[t] || 0) + 1;
    if (!statsVesselCache.terminals[t]) statsVesselCache.terminals[t] = [];
    statsVesselCache.terminals[t].push(c);
  });
  let maxTerm = Math.max(1, ...Object.values(termMap));
  $('statTerminals').innerHTML = Object.entries(termMap)
    .sort((a,b) => b[1] - a[1])
    .map(([k,v]) => `
      <div class="barrow">
        <span class="barrow-label" onmouseenter="showStatsPopover(event, 'terminals', '${esc(k)}')" onmouseleave="scheduleHideStatsPopover()">${esc(k)}</span>
        <div class="barbg"><div class="barfill" style="width:${(v/maxTerm*100).toFixed(1)}%"></div></div>
        <b>${v}</b>
      </div>
    `).join('');

  let opMap = {};
  list.forEach(c => {
    let op = (c.operator || (currentLang === 'vi' ? 'Không xác định' : 'Unknown')).trim();
    opMap[op] = (opMap[op] || 0) + 1;
    if (!statsVesselCache.operators[op]) statsVesselCache.operators[op] = [];
    statsVesselCache.operators[op].push(c);
  });
  let maxOp = Math.max(1, ...Object.values(opMap));
  $('statOperators').innerHTML = Object.entries(opMap)
    .sort((a,b) => b[1] - a[1])
    .slice(0, 10)
    .map(([k,v]) => `
      <div class="barrow">
        <span class="barrow-label" onmouseenter="showStatsPopover(event, 'operators', '${esc(k)}')" onmouseleave="scheduleHideStatsPopover()">${esc(k)}</span>
        <div class="barbg"><div class="barfill gold" style="width:${(v/maxOp*100).toFixed(1)}%"></div></div>
        <b>${v}</b>
      </div>
    `).join('');

  let loaBins = { '< 150m': 0, '150m - 200m': 0, '200m - 250m': 0, '250m - 300m': 0, '≥ 300m': 0 };
  Object.keys(loaBins).forEach(k => { statsVesselCache.loaBins[k] = []; });

  list.forEach(c => {
    let l = c.loa || 0;
    let bKey = '< 150m';
    if (l < 150) bKey = '< 150m';
    else if (l < 200) bKey = '150m - 200m';
    else if (l < 250) bKey = '200m - 250m';
    else if (l < 300) bKey = '250m - 300m';
    else bKey = '≥ 300m';

    loaBins[bKey]++;
    statsVesselCache.loaBins[bKey].push(c);
  });
  let maxLoa = Math.max(1, ...Object.values(loaBins));
  $('statLoaBins').innerHTML = Object.entries(loaBins)
    .map(([k,v]) => `
      <div class="barrow">
        <span class="barrow-label" onmouseenter="showStatsPopover(event, 'loaBins', '${k}')" onmouseleave="scheduleHideStatsPopover()">${k}</span>
        <div class="barbg"><div class="barfill" style="width:${(v/maxLoa*100).toFixed(1)}%"></div></div>
        <b>${v}</b>
      </div>
    `).join('');

  let hourArr = new Array(24).fill(0);
  list.forEach(c => {
    if (c.etb) {
      let d = new Date(c.etb);
      if (!isNaN(d)) {
        let h = d.getHours();
        hourArr[h]++;
      }
    }
  });
  let maxHour = Math.max(1, ...hourArr);
  let hourHtml = '';
  for (let h = 0; h < 24; h++) {
    let cnt = hourArr[h];
    let pct = (cnt / maxHour * 100).toFixed(1);
    hourHtml += `
      <div class="hour-cell">
        <div class="hour-cell-top"><span>${String(h).padStart(2,'0')}:00</span><span><b>${cnt}</b> ${dict[currentLang].shipsUnit}</span></div>
        <div class="hour-meter"><i style="width:${pct}%"></i></div>
      </div>
    `;
  }
  $('statHours').innerHTML = hourHtml;
}

function showStatsPopover(e, groupKey, labelName) {
  clearStatsPopoverTimeout();
  let ships = (statsVesselCache[groupKey] && statsVesselCache[groupKey][labelName]) ? statsVesselCache[groupKey][labelName] : [];
  if (!ships || ships.length === 0) return;

  $('popTitle').textContent = labelName;
  $('popBadge').textContent = `${ships.length} ${dict[currentLang].shipsUnit}`;

  let arrPrefix = currentLang === 'vi' ? 'Cập: ' : 'Arr: ';
  let listHtml = ships.map((s, idx) => `
    <div class="pop-item">
      <div class="pop-item-top">
        <span>${idx + 1}. ${esc(s.vessel)}</span>
        <span style="color:var(--cyan)">${s.loa ? s.loa + 'm' : ''}</span>
      </div>
      <div class="pop-item-meta">
        <span>${esc(s.terminal || '—')} ${esc(s.berth || '')}</span>
        <span>${arrPrefix}${dt(s.etb)}</span>
      </div>
    </div>
  `).join('');

  $('popList').innerHTML = listHtml;

  let pop = $('statsVesselPopover');
  pop.style.display = 'block';

  let rect = e.target.getBoundingClientRect();
  let left = rect.right + 10;
  let top = rect.top - 20;

  if (left + 300 > window.innerWidth) {
    left = rect.left - 305;
  }
  if (top + 230 > window.innerHeight) {
    top = window.innerHeight - 240;
  }

  pop.style.left = Math.max(10, left) + 'px';
  pop.style.top = Math.max(10, top) + 'px';
}

function scheduleHideStatsPopover() {
  clearStatsPopoverTimeout();
  statsPopoverTimeout = setTimeout(() => {
    hideStatsPopover();
  }, 1000);
}

function clearStatsPopoverTimeout() {
  if (statsPopoverTimeout) {
    clearTimeout(statsPopoverTimeout);
    statsPopoverTimeout = null;
  }
}

function hideStatsPopover() {
  let pop = $('statsVesselPopover');
  if (pop) pop.style.display = 'none';
}

function showTooltip(e, s) {
  if (tooltipHideTimeout) {
    clearTimeout(tooltipHideTimeout);
    tooltipHideTimeout = null;
  }
  selectedShipForReport = s;
  let tt = $('shipTooltip');
  $('ttName').textContent = s.vessel;
  $('ttOperator').textContent = s.operator || '—';
  $('ttLoa').textContent = s.loa + 'm';
  $('ttDwt').textContent = s.dwt ? Number(s.dwt).toLocaleString(currentLang === 'vi' ? 'vi-VN' : 'en-US') + ' T' : '—';
  $('ttEtb').textContent = dt(s.etb);
  $('ttEtd').textContent = dt(s.etd);

  let now = Date.now();
  let t1 = s.etb ? new Date(s.etb).getTime() : 0;
  let t2 = s.etd ? new Date(s.etd).getTime() : 0;

  if (t1 > 0 && now >= t1) {
    let dockedMs = (now > t2 && t2 > 0) ? (t2 - t1) : (now - t1);
    $('ttDocked').textContent = formatDuration(dockedMs);
  } else {
    $('ttDocked').textContent = currentLang === 'vi' ? 'Chưa cập' : 'Not arrived';
  }

  if (t2 > 0 && t2 > now) {
    $('ttRemaining').textContent = formatDuration(t2 - now);
  } else if (t2 > 0 && now >= t2) {
    $('ttRemaining').textContent = currentLang === 'vi' ? 'Đã rời bến' : 'Departed';
  } else {
    $('ttRemaining').textContent = '—';
  }

  tt.style.display = 'block';
  tt.style.left = Math.min(e.clientX + 10, window.innerWidth - 320) + 'px';
  tt.style.top = Math.min(e.clientY + 10, window.innerHeight - 220) + 'px';
}

function scheduleHideTooltip() {
  if (tooltipHideTimeout) clearTimeout(tooltipHideTimeout);
  tooltipHideTimeout = setTimeout(() => {
    hideTooltip();
  }, 3000);
}

function hideTooltip() {
  $('shipTooltip').style.display = 'none';
}

$('shipTooltip').onmouseenter = () => {
  if (tooltipHideTimeout) {
    clearTimeout(tooltipHideTimeout);
    tooltipHideTimeout = null;
  }
};
$('shipTooltip').onmouseleave = () => {
  scheduleHideTooltip();
};
